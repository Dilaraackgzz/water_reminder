name: water_reminder
description: "Aqualert - Professional water drinking reminder app with beautiful animations"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.3

  # Code Generation & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & Design
  material_design_icons_flutter: ^7.0.7296
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  fl_chart: ^0.69.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  firebase_analytics: ^11.2.1
  google_sign_in: ^6.2.1

  # Local Storage & Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.19.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.4
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  file_picker: ^8.1.2

  # Icons
  cupertino_icons: ^1.0.8
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

